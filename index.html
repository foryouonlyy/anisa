<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Layar pembuka -->
    <div id="startScreen">
        <button id="startBtn">Open Surprise 🎁</button>
    </div>

    <!-- Isi -->
    <div class="container">

        <h1>Happy Birthday 🎂</h1>

        <img src="foto.jpg" id="photo" alt="Foto Ulang Tahun">

        <p id="timer"></p>

        <button id="btnUcapan">💌 Baca Ucapan</button>
        <p id="ucapan"></p>

        <!-- Kue -->
        <div class="cake">

            <div class="top-layer"></div>

            <div class="cream1"></div>
            <div class="cream2"></div>

            <div class="cherry c1"></div>
            <div class="cherry c2"></div>
            <div class="cherry c3"></div>

            <div class="number-candle">
                <div class="num">
                    1
                    <div class="flame"></div>
                </div>

                <div class="num">
                    8
                    <div class="flame"></div>
                </div>
            </div>

        </div>

        <button id="blowBtn">🕯️ Tiup Lilin</button>

    </div>

    <!-- Musik -->
    <audio id="music" loop>
        <source src="lagu.mp3" type="audio/mp3">
    </audio>

    <!-- Script -->
    <script src="script.js"></script>

</body>
    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Anisa! 🎂</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Poppins', sans-serif, Arial;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            color: #fff;
        }

        .container {
            z-index: 10;
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .photo-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 20px auto;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .instruction {
            font-size: 0.9rem;
            font-style: italic;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 12px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* Styling Balon */
        .balloon-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            pointer-events: auto;
            animation: flyUp 6s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: inset -7px -7px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 22px;
            width: 2px;
            height: 10px;
            background-color: rgba(255,255,255,0.7);
        }

        @keyframes flyUp {
            0% {
                bottom: -100px;
                transform: scale(1);
            }
            100% {
                bottom: 105vh;
                transform: scale(1);
            }
        }

        /* Hitung Skor Balon Pecah */
        .score-board {
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    
</body>
    </html>
</html>
