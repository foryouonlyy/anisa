    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Anisa! 🎂</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Poppins', sans-serif, Arial;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            color: #fff;
        }

        .container {
            z-index: 10;
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .photo-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 20px auto;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .instruction {
            font-size: 0.9rem;
            font-style: italic;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 12px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* Styling Balon */
        .balloon-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            pointer-events: auto;
            animation: flyUp 6s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: inset -7px -7px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 22px;
            width: 2px;
            height: 10px;
            background-color: rgba(255,255,255,0.7);
        }

        @keyframes flyUp {
            0% {
                bottom: -100px;
                transform: scale(1);
            }
            100% {
                bottom: 105vh;
                transform: scale(1);
            }
        }

        /* Hitung Skor Balon Pecah */
        .score-board {
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="balloon-container" id="balloonContainer"></div>

    <div class="container">
        <h1>Happy Birthday 🎂</h1>
        
        <div class="photo-frame">
            <img src="foto.jpg" alt="Foto Ulang Tahun Anisa">
        </div>

        <div class="instruction">🎈 Klik balon-balon di layar untuk memecahkannya!</div>
        
        <p>Semoga hari spesialmu dipenuhi dengan kebahagiaan, senyuman, dan hal-hal baik yang menyertai usiamu yang baru! ✨</p>

        <div class="score-board">Balon pecah: <span id="score">0</span></div>
    </div>

    <audio loop autoplay>
        <source src="lagu.mp3" type="audio/mp3">
        Browser kamu tidak mendukung pemutar audio.
    </audio>

    <script>
        let score = 0;
        const balloonContainer = document.getElementById('balloonContainer');
        const scoreDisplay = document.getElementById('score');

        // Warna-warna balon yang cerah
        const colors = ['#ff4d4d', '#ff6b81', '#ffa502', '#2ed573', '#1e90ff', '#9b59b6', '#ff6fa8'];

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            
            // Posisi dan warna acak
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomX = Math.random() * (window.innerWidth - 60);
            const randomDuration = Math.random() * 3 + 4; // Durasi terbang 4-7 detik
            
            balloon.style.backgroundColor = randomColor;
            balloon.style.left = randomX + 'px';
            balloon.style.animationDuration = randomDuration + 's';

            // Event saat balon diklik (dipecahkan)
            balloon.addEventListener('mousedown', () => {
                popBalloon(balloon);
            });
            balloon.addEventListener('touchstart', (e) => {
                e.preventDefault();
                popBalloon(balloon);
            });

            balloonContainer.appendChild(balloon);

            // Hapus balon dari DOM setelah animasinya selesai agar tidak menumpuk
            setTimeout(() => {
                if (balloon.parentElement) {
                    balloon.remove();
                }
            }, randomDuration * 1000);
        }

        function popBalloon(balloon) {
            score++;
            scoreDisplay.textContent = score;

            // Efek suara letupan menggunakan Web Audio API sederhana (tanpa file eksternal)
            playPopSound();

            // Efek visual saat pecah (mengecil lalu hilang)
            balloon.style.transform = 'scale(1.4)';
            balloon.style.opacity = '0';
            setTimeout(() => {
                balloon.remove();
            }, 100);
        }

        // Fungsi pembuat suara "Pop" otomatis
        function playPopSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                // Abaikan jika browser memblokir audio context otomatis sebelum interaksi pertama
            }
        }

        // Munculkan balon secara berkala setiap 600 milidetik
        setInterval(createBalloon, 600);
    </script>
</body>
    </html>
</html>
